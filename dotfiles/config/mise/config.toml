# Global mise tools. Linked to ~/.config/mise/config.toml; home-manager
# activation runs `mise install` so these land on every machine.
# Browse available tools: `mise registry` or https://mise.jdx.dev/registry.html

[tools]
# Shared — installed on every machine.
node      = "lts"
go        = "latest"
ripgrep   = "latest"
fd        = "latest"
bat       = "latest"
jq        = "latest"
delta     = "latest"
python    = "3.12"
rust      = "stable"  # rustup-backed; puts cargo/rustc/rustfmt/clippy on ~/.cargo/bin

[env]
EDITOR = "helix"

[settings]
# experimental = true

[tasks]
# `mise run <name>` — see https://mise.jdx.dev/tasks/

# [tasks.hello]
# run = "echo hello"
